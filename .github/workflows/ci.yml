name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  
jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Automatically use the version specified in go.mod
          go-version-file: 'go.mod'
      
      - name: Show Go version
        run: go version

      - name: Check formatting
        run: |
          changed=$(gofmt -l .)
          if [ -n "$changed" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$changed"
            echo
            echo "Run 'gofmt -w .' locally and commit the result."
            exit 1
          fi

      - name: Check whitespace
        run: git diff --check
      
      - name: Build all packages
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Check Linux packaging shell syntax
        if: runner.os == 'Linux'
        run: |
          bash -n packaging/linux/*.sh
          bash -n examples/*.sh

      - name: Build local release artifacts
        if: runner.os == 'Linux'
        run: go run ./tools/releasebuild --out "${RUNNER_TEMP}/planetary-mesh-dist" --version dev

      - name: Run pmctl doctor smoke
        if: runner.os == 'Linux'
        run: GOCACHE="${RUNNER_TEMP}/planetary-mesh-gocache-doctor" ./examples/doctor_smoke.sh

      - name: Run capability-aware scheduler smoke
        if: runner.os == 'Linux'
        run: GOCACHE="${RUNNER_TEMP}/planetary-mesh-gocache-scheduler" ./examples/scheduler_smoke.sh

      - name: Run release smoke
        if: runner.os == 'Linux'
        run: GOCACHE="${RUNNER_TEMP}/planetary-mesh-gocache-release" ./examples/release_smoke.sh

      - name: Run Linux service install and systemd smoke
        if: runner.os == 'Linux'
        run: GOCACHE="${RUNNER_TEMP}/planetary-mesh-gocache-linux-service" ./examples/linux_service_install_smoke.sh

  postgres-integration:
    name: Postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planetary
          POSTGRES_PASSWORD: planetary
          POSTGRES_DB: planetary_mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planetary -d planetary_mesh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Run Postgres integration tests
        env:
          POSTGRES_TEST_DSN: postgres://planetary:planetary@localhost:5432/planetary_mesh?sslmode=disable
        run: go test -tags postgres ./internal/coordinator
