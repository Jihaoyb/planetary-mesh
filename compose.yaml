services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: planetary
      POSTGRES_PASSWORD: planetary
      POSTGRES_DB: planetary_mesh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planetary -d planetary_mesh"]
      interval: 2s
      timeout: 3s
      retries: 10

  coordinator:
    image: golang:1.25
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: go run ./cmd/coordinator
    environment:
      COORDINATOR_ADDR: ":8080"
      COORDINATOR_DATABASE_URL: "postgres://planetary:planetary@postgres:5432/planetary_mesh?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  agent-1:
    image: golang:1.25
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: go run ./cmd/agent
    environment:
      COORDINATOR_URL: "http://coordinator:8080"
      AGENT_ADDR: ":8081"
      AGENT_ADVERTISE_ADDR: "http://agent-1:8081"
      NODE_ID: "compose-agent-1"
      AGENT_COMMAND_ALLOWLIST: "echo=echo,false=false,sleep=sleep"
    ports:
      - "8081:8081"
    depends_on:
      - coordinator

  agent-2:
    image: golang:1.25
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: go run ./cmd/agent
    environment:
      COORDINATOR_URL: "http://coordinator:8080"
      AGENT_ADDR: ":8082"
      AGENT_ADVERTISE_ADDR: "http://agent-2:8082"
      NODE_ID: "compose-agent-2"
      AGENT_COMMAND_ALLOWLIST: "echo=echo,false=false,sleep=sleep"
    ports:
      - "8082:8082"
    depends_on:
      - coordinator

volumes:
  postgres-data:
